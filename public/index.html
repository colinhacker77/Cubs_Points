<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buckshaw ROF Cubs Points</title>
  <meta name="theme-color" content="#24104a">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="page-shell">
    <div class="mountains"></div>
    <div class="page-decor">
      <div class="sky-scribble scribble-left">Skills<br>Friends<br>Adventure<br>Points!</div>
      <div class="sky-scribble scribble-right">Braver<br>Kinder<br>Higher</div>
      <div class="moon"></div>
      <div class="signpost" aria-hidden="true">
        <span>Explore</span>
        <span>Learn</span>
        <span>Belong</span>
      </div>
      <div class="camp-side" aria-hidden="true">
        <div class="tent"></div>
        <div class="campfire"></div>
      </div>
    </div>
    <header class="hero">
      <h1>Buckshaw ROF <span>Cubs Points</span></h1>
      <div class="subtitle" id="displaySubtitle">Six Points Totals</div>
      <div class="score-view-switch" aria-label="Score view">
        <button id="termViewBtn" class="view-switch-btn active" type="button">Term total</button>
        <button id="yearViewBtn" class="view-switch-btn" type="button">Year total</button>
      </div>
    </header>

    <main class="board-wrap" aria-live="polite">
      <section class="tubes" id="tubes"></section>
      <div class="footer-quote">“Good Cubs make a brighter tomorrow”</div>
      <div class="status-line" id="status">Loading points…</div>
      <section class="term-history" aria-labelledby="termHistoryTitle">
        <h2 id="termHistoryTitle">Points through the year</h2>
        <div id="termHistoryGrid" class="term-history-grid"></div>
      </section>
    </main>
  </div>
  <script type="module" src="/display.js"></script>
</body>
</html>
